; Firmware da ESP32 - central de alarme 4 zonas
; Abrir a pasta esp32/ no VS Code com a extensao PlatformIO.
; A versao da plataforma fica travada para o projeto compilar igual em qualquer PC.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
